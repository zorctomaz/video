<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>FOTRA :: VIDEO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  :root{
    --dos-blue: #0000AA;
    --dos-blue-dark: #000077;
    --cyan: #55FFFF;
    --cyan-dim: #00AAAA;
    --white: #FFFFFF;
    --yellow: #FFFF55;
    --grey: #AAAAAA;
    --black: #000000;
    --maxw: 1180px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    background: var(--dos-blue);
    color: var(--white);
    font-family: 'VT323', monospace;
  }

  body{
    height:100svh;
    display:flex;
    align-items:stretch;
    justify-content:stretch;
    padding:0;
  }

  /* CRT scanlines */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 5;
  }

  /* .screen itself fills the viewport, so its border sits right at the
     edge — a single frame, exactly like fotra.net / jadranje.fotra.net /
     norway.fotra.net, instead of a smaller centered box plus an overlay. */
  .screen{
    width:100%;
    height:100%;
    max-width:none;
    border: 6px double var(--cyan);
    background: var(--dos-blue);
    padding: clamp(1rem, 4vw, 1.8rem) clamp(1.2rem, 4vw, 2.2rem) clamp(1.4rem, 4vw, 2rem);
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    overflow-y:auto;
  }

  /* Content column matches jadranje.fotra.net / norway.fotra.net (--maxw),
     so text/media don't stretch edge-to-edge on very wide screens. */
  .screen > *{ width:100%; max-width: var(--maxw); margin-left:auto; margin-right:auto; }

  /* The divider still reaches the frame edge (cancels .screen's own side
     padding); its content is re-centered at --maxw via .titlebar-inner. */
  .titlebar{
    /* width must stay auto: an explicit width alongside explicit left+right
       margins is an over-constrained box, and browsers resolve that by
       silently discarding margin-right (LTR) — which quietly cancelled the
       right side of this exact fix. auto lets both margins be honored. */
    width:auto;
    max-width:none;
    text-align:center;
    border-bottom: 2px solid var(--cyan-dim);
    margin: 0 calc(-1 * clamp(1.2rem, 4vw, 2.2rem)) 1.3rem;
    padding-bottom: 0.9rem;
  }
  .titlebar-inner{
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 clamp(1.2rem, 4vw, 2.2rem);
    position:relative;
  }

  .lang-toggle{
    position:absolute;
    top: 0;
    right: clamp(1.2rem, 4vw, 2.2rem);
    display:flex;
    border: 2px solid var(--cyan);
  }

  .lang-btn{
    font-family:'VT323', monospace;
    background: var(--dos-blue);
    color: var(--cyan);
    border: none;
    padding: 0.2rem 0.6rem;
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    cursor:pointer;
    letter-spacing: 0.05em;
  }

  .lang-btn + .lang-btn{ border-left: 2px solid var(--cyan); }

  .lang-btn.active{
    background: var(--cyan);
    color: var(--black);
  }

  .home-btn{
    position:absolute;
    top:0;
    left: clamp(1.2rem, 4vw, 2.2rem);
    display:inline-flex;
    color: var(--cyan);
    text-decoration:none;
    transition: color .15s ease, transform .15s ease;
  }

  .home-btn svg{ width:20px; height:20px; flex:none; }

  .home-btn:hover, .home-btn:focus-visible{ color: var(--yellow); transform:translateY(-1px); }

  .ascii-title{
    font-size: clamp(2.2rem, 9vw, 3.2rem);
    line-height:1;
    letter-spacing: 0.12em;
    color: var(--yellow);
    text-shadow: 0 0 6px rgba(255,255,85,0.5);
    margin: 0 0 0.35rem;
  }

  .sub{
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: var(--cyan);
    letter-spacing: 0.08em;
    margin:0;
  }

  .video-list{
    display:flex;
    flex-direction:column;
    gap: 1.3rem;
  }

  .video-item{
    border: 2px solid var(--cyan-dim);
  }

  .video-num{
    display:flex;
    align-items:center;
    gap: 0.6rem;
    padding: 0.4rem 0.7rem;
    border-bottom: 2px solid var(--cyan-dim);
    font-size: clamp(1.05rem, 3.4vw, 1.25rem);
  }

  .video-num .n{
    color: var(--black);
    background: var(--yellow);
    padding: 0 0.5em;
    font-weight:normal;
  }

  .video-frame{
    position:relative;
    width:100%;
    aspect-ratio: 16/9;
    background: var(--black);
  }

  .video-frame iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }

  .statusbar{
    margin-top: 1.3rem;
    padding-top: 0.9rem;
    border-top: 2px solid var(--cyan-dim);
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: var(--grey);
  }

  .term-log{ display:flex; flex-direction:column; gap:2px; max-height:7.4em; overflow-y:auto; margin-bottom:.5rem; }
  .term-log div{ white-space:pre-wrap; word-break:break-word; }
  .term-line{ display:flex; align-items:center; gap: 0.5rem; cursor: text; }
  .term-input{
    flex:1; min-width:0; background:transparent; border:none; outline:none; padding:0;
    color: var(--white); font-family:'VT323', monospace; font-size: inherit; caret-color: var(--white);
  }
  .term-input::placeholder{ color: var(--grey); opacity:.85; }

  /* ---------- SNAKE overlay (BACK / SNAKE terminal commands) ---------- */
  .snake-overlay{
    position:fixed; inset:0; z-index:2000;
    background: rgba(0,0,20,0.94);
    display:none; align-items:center; justify-content:center; padding: 24px;
  }
  .snake-overlay:not([hidden]){ display:flex; }
  .snake-box{
    position:relative;
    width:100%; max-width: 360px;
    border: 6px double var(--cyan);
    background: var(--dos-blue);
    padding: clamp(1rem, 4vw, 1.8rem);
    text-align:center;
  }
  .snake-titlebar{
    border-bottom: 2px solid var(--cyan-dim);
    padding-bottom: 0.7rem;
    margin-bottom: 1rem;
  }
  .snake-title{
    font-size: clamp(1.8rem, 7vw, 2.6rem); line-height:1; letter-spacing:.1em;
    color: var(--yellow); text-shadow: 0 0 6px rgba(255,255,85,.5); margin:0 0 .3rem;
  }
  .snake-score{ font-size: clamp(1rem, 3vw, 1.2rem); color: var(--cyan); margin:0; }
  .canvas-wrap{ display:flex; justify-content:center; padding: .4rem 0; }
  #snakeCanvas{
    background: var(--black); border: 3px double var(--cyan);
    width: min(100%, 260px); height:auto; aspect-ratio: 1/1; image-rendering: pixelated;
  }
  .dpad{
    display:grid; grid-template-columns: repeat(3, clamp(44px, 12vw, 54px)); grid-template-rows: repeat(3, clamp(44px, 12vw, 54px));
    gap: 12px; justify-content:center; width:100%; margin: 1rem auto 0; -webkit-user-select:none; user-select:none;
  }
  .dpad-btn{
    font-family:'VT323', monospace; background: var(--dos-blue); color: var(--cyan);
    border: 2px solid var(--cyan); font-size: clamp(1.3rem, 5vw, 1.7rem); line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action: manipulation;
  }
  .dpad-up{ grid-column:2; grid-row:1; } .dpad-left{ grid-column:1; grid-row:2; }
  .dpad-right{ grid-column:3; grid-row:2; } .dpad-down{ grid-column:2; grid-row:3; }
  .dpad-btn:active{ background: var(--cyan); color: var(--black); }
  .snake-status{
    margin-top: 1rem; padding-top: .8rem; border-top: 2px solid var(--cyan-dim);
    font-size: clamp(.9rem, 3vw, 1.1rem); color: var(--grey);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:.4rem;
  }
  .snake-close{
    position:absolute; top:0; right:0; background:none; border:none; color: var(--cyan);
    font-family:'VT323', monospace; font-size: 1.4rem; cursor:pointer; line-height:1; padding:.2rem .4rem;
  }
  .snake-close:hover{ color: var(--yellow); }

  .prompt{ color: var(--white); }

  .cursor{
    display:inline-block;
    width: 0.55em;
    background: var(--white);
    animation: blink 1s steps(1) infinite;
    margin-left: 2px;
  }

  .cursor::after{ content:"\00a0"; }

  @keyframes blink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .cursor{ animation:none; }
  }
</style>
</head>
<body>

  <div class="screen">
    <div class="titlebar">
      <div class="titlebar-inner">
        <a class="home-btn" href="https://fotra.net/" aria-label="fotra.net" title="fotra.net">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-5h4v5h4a1 1 0 0 0 1-1v-9"/></svg>
        </a>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="sl">SI</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
        <p class="ascii-title">VIDEO</p>
        <p class="sub" data-sl="ZADNJI POSNETKI" data-en="LATEST CLIPS">ZADNJI POSNETKI</p>
      </div>
    </div>

    <div class="video-list">
      <div class="video-item">
        <div class="video-num"><span class="n">1</span> <span data-sl="POSNETEK 1" data-en="CLIP 1">POSNETEK 1</span></div>
        <div class="video-frame">
          <iframe src="https://www.youtube.com/embed/ANJt-dXkMVA" title="Video 1" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
      </div>

      <div class="video-item">
        <div class="video-num"><span class="n">2</span> <span data-sl="POSNETEK 2" data-en="CLIP 2">POSNETEK 2</span></div>
        <div class="video-frame">
          <iframe src="https://www.youtube.com/embed/BbXSDa-yFgM" title="Video 2" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
      </div>

      <div class="video-item">
        <div class="video-num"><span class="n">3</span> <span data-sl="POSNETEK 3" data-en="CLIP 3">POSNETEK 3</span></div>
        <div class="video-frame">
          <iframe src="https://www.youtube.com/embed/9GSd50Vraus" title="Video 3" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
      </div>

      <div class="video-item">
        <div class="video-num"><span class="n">4</span> <span data-sl="POSNETEK 4" data-en="CLIP 4">POSNETEK 4</span></div>
        <div class="video-frame">
          <iframe src="https://www.youtube.com/embed/pAsRGFwxPQs" title="Video 4" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
      </div>
    </div>

    <div class="statusbar">
      <div class="term-log" id="termLog" aria-live="polite"></div>
      <div class="term-line">
        <label for="termInput" class="prompt">C:\FOTRA\VIDEO&gt;</label>
        <input type="text" id="termInput" class="term-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command input" placeholder="vnesi ukaz (HELP)" data-sl-ph="vnesi ukaz (HELP)" data-en-ph="type a command (HELP)">
      </div>
    </div>
  </div>

<div class="snake-overlay" id="snakeOverlay" hidden>
  <div class="snake-box">
    <button type="button" class="snake-close" id="snakeClose" aria-label="Close">✕</button>
    <div class="snake-titlebar">
      <p class="snake-title" data-sl="KAČA" data-en="SNAKE">KAČA</p>
      <p class="snake-score" id="snakeScore">SCORE: 0</p>
    </div>
    <div class="canvas-wrap">
      <canvas id="snakeCanvas" width="220" height="220"></canvas>
    </div>
    <div class="dpad" role="group" aria-label="Snake controls">
      <button type="button" class="dpad-btn dpad-up" data-dir="up" aria-label="Up">&#9650;</button>
      <button type="button" class="dpad-btn dpad-left" data-dir="left" aria-label="Left">&#9664;</button>
      <button type="button" class="dpad-btn dpad-right" data-dir="right" aria-label="Right">&#9654;</button>
      <button type="button" class="dpad-btn dpad-down" data-dir="down" aria-label="Down">&#9660;</button>
    </div>
    <div class="snake-status">
      <span id="snakeMsg" data-sl="PUŠČICE/GUMBI = PREMIK" data-en="ARROWS/BTNS = MOVE">PUŠČICE/GUMBI = PREMIK</span>
      <span data-sl="ESC=NAZAJ" data-en="ESC=BACK">ESC=NAZAJ</span>
    </div>
  </div>
</div>

<script>
  function setLang(lang){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-sl][data-en]').forEach(function(el){
      el.textContent = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-sl');
    });
    document.querySelectorAll('.lang-btn').forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
    var termInputEl = document.getElementById('termInput');
    if(termInputEl){
      termInputEl.placeholder = termInputEl.getAttribute(lang === 'en' ? 'data-en-ph' : 'data-sl-ph');
    }
    try{ localStorage.setItem('fotraLang', lang); }catch(e){}
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ setLang(btn.getAttribute('data-lang')); });
  });

  // ---------- SNAKE game + BACK/SNAKE terminal commands ----------
  (function(){
    var overlay = document.getElementById('snakeOverlay');
    var canvas = document.getElementById('snakeCanvas');
    var ctx = canvas.getContext('2d');
    var scoreEl = document.getElementById('snakeScore');
    var msgEl = document.getElementById('snakeMsg');
    var closeBtn = document.getElementById('snakeClose');
    var termInput = document.getElementById('termInput');

    var GRID = 20;
    var CELL = canvas.width / GRID;
    var snake, dir, nextDir, food, score, loopId, gameOver, gameStarted;
    var msgState = 'idle';
    var msgs = {
      sl: { idle:'PUŠČICE/GUMBI = PREMIK', playing:'IGRA SE...', over:'KONEC - ENTER/GUMB=ZNOVA' },
      en: { idle:'ARROWS/BTNS = MOVE', playing:'PLAYING...', over:'GAME OVER - ENTER/BTN=RESTART' }
    };
    function currentLang(){ return document.documentElement.lang === 'en' ? 'en' : 'sl'; }
    function updateMsg(){ msgEl.textContent = msgs[currentLang()][msgState]; }

    function resetGame(){
      snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      dir = {x:1,y:0}; nextDir = {x:1,y:0};
      score = 0; gameOver = false; gameStarted = false;
      placeFood();
      scoreEl.textContent = 'SCORE: 0';
      msgState = 'idle'; updateMsg();
      drawGame();
    }
    function placeFood(){
      var ok = false;
      while(!ok){
        food = { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
        ok = !snake.some(function(s){ return s.x === food.x && s.y === food.y; });
      }
    }
    function drawGame(){
      ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#FF5555'; ctx.fillRect(food.x*CELL, food.y*CELL, CELL, CELL);
      snake.forEach(function(seg, i){
        ctx.fillStyle = i === 0 ? '#FFFFFF' : '#55FF55';
        ctx.fillRect(seg.x*CELL + 1, seg.y*CELL + 1, CELL - 2, CELL - 2);
      });
    }
    function tick(){
      if(gameOver) return;
      dir = nextDir;
      var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      var hitWall = head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
      var hitSelf = snake.some(function(s){ return s.x === head.x && s.y === head.y; });
      if(hitWall || hitSelf){
        gameOver = true; clearInterval(loopId); msgState = 'over'; updateMsg();
        return;
      }
      snake.unshift(head);
      if(head.x === food.x && head.y === food.y){
        score += 10; scoreEl.textContent = 'SCORE: ' + score; placeFood();
      } else {
        snake.pop();
      }
      drawGame();
    }
    function startGame(){
      if(gameStarted) return;
      gameStarted = true; msgState = 'playing'; updateMsg();
      loopId = setInterval(tick, 120);
    }
    function applyDir(d){
      if(gameOver) return;
      if(dir.x + d.x !== 0 || dir.y + d.y !== 0){ nextDir = d; }
      startGame();
    }
    var dirMap = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
    document.querySelectorAll('.dpad-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.preventDefault();
        if(gameOver){ resetGame(); return; }
        applyDir(dirMap[btn.getAttribute('data-dir')]);
      });
    });

    var snakeHistoryPushed = false;
    function openSnake(){
      overlay.hidden = false;
      resetGame();
      history.pushState({ fotraScreen:'snake' }, '');
      snakeHistoryPushed = true;
    }
    function closeSnake(viaPopstate){
      clearInterval(loopId);
      overlay.hidden = true;
      termInput.focus({ preventScroll:true });
      if(snakeHistoryPushed && !viaPopstate){
        snakeHistoryPushed = false;
        history.back();
      } else {
        snakeHistoryPushed = false;
      }
    }
    window.addEventListener('popstate', function(){
      if(!overlay.hidden){ closeSnake(true); }
    });
    closeBtn.addEventListener('click', function(){ closeSnake(); });

    document.addEventListener('keydown', function(e){
      if(!overlay.hidden){
        var arrowMap = { ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0} };
        if(e.key === 'Escape'){ e.preventDefault(); closeSnake(); return; }
        if(arrowMap[e.key]){ e.preventDefault(); applyDir(arrowMap[e.key]); return; }
        if(gameOver && e.key === 'Enter'){ e.preventDefault(); resetGame(); return; }
        return;
      }
      if(e.key === 'Escape'){
        window.location.href = 'https://fotra.net/';
      }
    });

    var termLog = document.getElementById('termLog');
    var termHelp = {
      sl: ['Ukazi: BACK = nazaj na fotra.net    SNAKE = igra Kača', 'HELP = ta pomoč'],
      en: ['Commands: BACK = back to fotra.net    SNAKE = Snake game', 'HELP = this help']
    };
    var termUnknown = {
      sl: function(c){ return ["'" + c + "' ni prepoznan kot ukaz.", 'Vtipkaj HELP za pomoč.']; },
      en: function(c){ return ["'" + c + "' is not a recognized command.", 'Type HELP for help.']; }
    };
    function termPrint(lines){
      lines.forEach(function(line){
        var row = document.createElement('div');
        row.textContent = line;
        termLog.appendChild(row);
      });
      termLog.scrollTop = termLog.scrollHeight;
    }
    function termRunCommand(raw){
      var cmd = raw.trim();
      if(!cmd) return;
      termPrint(['C:\\FOTRA\\VIDEO>' + cmd]);
      var norm = cmd.toUpperCase();
      if(norm === 'BACK'){
        termPrint([currentLang() === 'sl' ? 'Odpiram ...' : 'Opening ...']);
        window.setTimeout(function(){ window.location.href = 'https://fotra.net/'; }, 200);
        return;
      }
      if(norm === 'SNAKE'){
        termPrint([currentLang() === 'sl' ? 'Zaganjam KACA.EXE ...' : 'Launching SNAKE.EXE ...']);
        window.setTimeout(openSnake, 200);
        return;
      }
      if(norm === 'HELP' || norm === '?'){ termPrint(termHelp[currentLang()]); return; }
      termPrint(termUnknown[currentLang()](cmd));
    }
    termInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        termRunCommand(termInput.value);
        termInput.value = '';
      }
    });
    document.querySelector('.statusbar').addEventListener('click', function(){ termInput.focus(); });

    // Deferred: runs after the initial-language IIFE below has called
    // setLang(), so the greeting prints in the language the page
    // actually loads in (?lang=, then localStorage, then sl default).
    setTimeout(function(){
      termPrint([currentLang() === 'sl' ? 'Vtipkaj HELP za seznam ukazov.' : 'Type HELP for a list of commands.']);
    }, 0);
  })();

  // Restore the language: ?lang= from a fotra.net link takes priority
  // (this is now a different origin, so localStorage isn't shared with
  // the hub), then this page's own last choice, then sl by default.
  (function(){
    var initialLang = 'sl';
    try{
      var urlLang = new URLSearchParams(window.location.search).get('lang');
      var stored = localStorage.getItem('fotraLang');
      if(urlLang === 'en' || urlLang === 'sl'){ initialLang = urlLang; }
      else if(stored === 'en' || stored === 'sl'){ initialLang = stored; }
    }catch(e){}
    setLang(initialLang);
  })();
</script>

</body>
</html>
